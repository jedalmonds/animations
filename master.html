// ONE MASTER CANVAS for the whole documentary diagram.
// World units: the reference overview frame (1920 x 1080 at zoom 1). Output size never changes the layout.
// Every sequence clip is a window of one continuous MASTER TIMELINE, so clip N's last frame is

// Query: ?seq=1&w=1280&fps=60   (w = output width, 16:9)

const qs = new URLSearchParams(location.search);

const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, u) => a + (b - a) * u;
const pr = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = u => { u = clamp(u, 0, 1); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };   // gentle cubic in-out

// ---------------- layout (world units) ----------------

const sqX = k => X0 + k * PITCH, sqCX = k => sqX(k) + SQ / 2, SQ_CY = SQ_TOP + SQ / 2;

// ---------------- master timeline (seconds) ----------------
// Sequence windows on the master clock. Later sequences are appended here.

const SEQS = {1: {start: 0, dur: 17}, 2: {start: 17, dur: 24.5}, 3: {start: 41.5, dur: 18.5}, 4: {start: 60, dur: 17},
  6: {start: 77, dur: 10}, 7: {start: 87, dur: 10},
  12: {start: 0, dur: 41.5}, 34: {start: 41.5, dur: 35.5}, 67: {start: 77, dur: 20},

const T = {

function camAt(t) {
  if (t <= CAM[0][0]) return CAM[0].slice(1);
  for (let i = 1; i < CAM.length; i++) if (t <= CAM[i][0]) {
    const [t0, x0, y0, z0] = CAM[i - 1], [t1, x1, y1, z1] = CAM[i], u = ease((t - t0) / (t1 - t0));
    return [lerp(x0, x1, u), lerp(y0, y1, u), Math.exp(lerp(Math.log(z0), Math.log(z1), u))];
  }
  return CAM.at(-1).slice(1);
}

// ---------------- background: screen-fixed warm gradient + very subtle grain ----------------
let BG = null;
function buildBG() {
  BG = document.createElement('canvas'); BG.width = OW; BG.height = OH; const g = BG.getContext('2d');
  const gr = g.createLinearGradient(0, 0, OW, OH); gr.addColorStop(0, '#efede4'); gr.addColorStop(1, '#e3e0d7'); g.fillStyle = gr; g.fillRect(0, 0, OW, OH);
  g.save(); g.globalAlpha = .018; g.fillStyle = '#fffdf5'; for (let i = 0; i < 9; i++) { g.beginPath(); const x = (i / 9) * OW * 1.3 - OW * .15; g.moveTo(x, 0); g.lineTo(x + OW * .06, 0); g.lineTo(x - OW * .28, OH); g.lineTo(x - OW * .34, OH); g.fill(); } g.restore();
  const id = g.getImageData(0, 0, OW, OH), d = id.data; let s = 1234567;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * 5; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
}

// ---------------- drawing primitives (world units) ----------------
function hArrow(c, x0, x1, y) { c.lineWidth = LW; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1 - 9, y); c.stroke(); c.beginPath(); c.moveTo(x1, y); c.lineTo(x1 - 11, y - 5.5); c.lineTo(x1 - 11, y + 5.5); c.closePath(); c.fill(); }
function vArrow(c, x, y0, y1, p) {
  if (p <= 0) return; const ye = lerp(y0, y1, p);
  c.lineWidth = LW; c.beginPath(); c.moveTo(x, y0); c.lineTo(x, Math.max(y0, ye - 9)); c.stroke();
  c.beginPath(); c.moveTo(x, ye); c.lineTo(x - 5.5, ye - 11); c.lineTo(x + 5.5, ye - 11); c.closePath(); c.fill();
}
function peso(c, cx, cy) {
  c.save(); c.translate(cx, cy); c.beginPath();

  c.moveTo(-37.7, 49.7); c.lineTo(-37.7, -49.3); c.lineTo(5, -49.3); c.arc(5, -17.15, 32.15, -Math.PI / 2, Math.PI / 2); c.lineTo(-14.3, 15); c.lineTo(-14.3, 49.7); c.closePath();
  c.moveTo(-14.3, -31); c.lineTo(-3, -31); c.arc(-3, -17.15, 13.85, -Math.PI / 2, Math.PI / 2); c.lineTo(-14.3, -3.3); c.closePath();
  c.fill('evenodd');
  c.fillRect(-45, -26.3, 89.7, 6.6); c.fillRect(-45, -14.3, 89.7, 6.6);    // double bar
  c.restore();
}
const PESO_OUT = new Path2D('M-37.7 49.7 L-37.7 -49.3 L5 -49.3 A32.15 32.15 0 0 1 5 15 L-14.3 15 L-14.3 49.7 Z'), PESO_OUT_L = 320;
const PESO_CTR = new Path2D('M-14.3 -31 L-3 -31 A13.85 13.85 0 0 1 -3 -3.3 L-14.3 -3.3 Z'), PESO_CTR_L = 94;
// The peso builds itself: outline traced, ink fills from the bottom up, then the two bars are drawn across.
function pesoBuild(c, cx, cy, t) {
  const P = T.peso, a = ease(pr(t, ...P.trace)); if (a <= 0) return;
  const f = ease(pr(t, ...P.fill)), b1 = ease(pr(t, P.bars[0], P.bars[1])), b2 = ease(pr(t, P.bars[2], P.bars[3]));
  c.save(); c.translate(cx, cy); c.lineWidth = LW; c.lineJoin = 'miter'; c.lineCap = 'butt';
  c.setLineDash([PESO_OUT_L * a, PESO_OUT_L + 5]); c.stroke(PESO_OUT);
  c.setLineDash([PESO_CTR_L * a, PESO_CTR_L + 5]); c.stroke(PESO_CTR); c.setLineDash([]);
  if (f > 0) { c.save(); c.beginPath(); c.rect(-60, 50 - 100 * f, 120, 100 * f); c.clip(); const p = new Path2D(); p.addPath(PESO_OUT); p.addPath(PESO_CTR); c.fill(p, 'evenodd'); c.restore(); }
  if (b1 > 0) c.fillRect(-45, -26.3, 89.7 * b1, 6.6);
  if (b2 > 0) c.fillRect(-45, -14.3, 89.7 * b2, 6.6);
  c.restore();
}
function sym(c, name, cx, cy, size, alpha = 1) {
  if (alpha <= 0) return; c.save(); c.globalAlpha *= alpha; c.translate(cx, cy); c.scale(size / 960, size / 960); c.translate(-480, 480); c.fill(new Path2D(MSYM[name])); c.restore();
}
// Word-by-word hard cuts: each line is laid out once (centred) so words never shift as others appear.
function wordsLine(c, words, times, cx, y, t) {
  const full = words.join(' '), x0 = cx - c.measureText(full).width / 2;
  words.forEach((w, i) => { if (t >= times[i]) c.fillText(w, x0 + c.measureText(words.slice(0, i).join(' ') + (i ? ' ' : '')).width, y); });
}
function diagramRow(c) {
  c.lineWidth = LW; c.lineJoin = 'miter';
  c.font = `700 48px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  for (let k = 0; k < 7; k++) {
    c.strokeRect(sqX(k), SQ_TOP, SQ, SQ);
    c.fillText(String(k + 1), sqCX(k), 256);
    if (k < 6) hArrow(c, sqX(k) + SQ + 9, sqX(k + 1) - 9, SQ_CY);
  }
}
function pie(c, t) {
  const sw = ease(pr(t, ...T.circleIn)); if (sw <= 0) return;
  const dv = ease(pr(t, ...T.divide)), sep = 7 * ease(pr(t, ...T.separate)), inA = 1;
  const [f0, fst, fd] = T.sliceFill, fillOf = i => pr(t, f0 + i * fst, f0 + i * fst + fd);
  c.save(); c.lineWidth = LW; c.lineJoin = 'round'; c.lineCap = 'round';
  if (dv <= 0) { c.beginPath(); c.arc(PIE.x, PIE.y, PIE.r, -Math.PI / 2, -Math.PI / 2 + sw * Math.PI * 2); c.stroke(); c.restore(); return; }
  let a0 = -Math.PI / 2;
  const wedges = SLICES.map((f, i) => { const a1 = a0 + f * Math.PI * 2, mid = (a0 + a1) / 2, w = {a0, a1, dx: Math.cos(mid) * sep, dy: Math.sin(mid) * sep, col: GREYS[i]}; a0 = a1; return w; });
  for (const [i, w] of wedges.entries()) {           // grey fills, one slice after another
    const fillA = fillOf(i); if (fillA <= 0) continue; c.save(); c.globalAlpha = inA * fillA; c.fillStyle = w.col;
    c.beginPath(); c.moveTo(PIE.x + w.dx, PIE.y + w.dy); c.arc(PIE.x + w.dx, PIE.y + w.dy, PIE.r, w.a0, w.a1); c.closePath(); c.fill(); c.restore();
  }
  for (const w of wedges) {           // outlines: rim + dividers that grow from the centre
    const cx = PIE.x + w.dx, cy = PIE.y + w.dy;
    c.beginPath(); c.arc(cx, cy, PIE.r, w.a0, w.a1); c.stroke();
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(w.a0) * PIE.r * dv, cy + Math.sin(w.a0) * PIE.r * dv); c.stroke();
    if (sep > 0) { c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(w.a1) * PIE.r, cy + Math.sin(w.a1) * PIE.r); c.stroke(); }
  }
  c.restore();
}

const LIST_ICONS = {Roads: 'road', Bridges: 'bridge', 'Water Resources': 'water', 'Public Buildings': 'publicBuilding', 'School Buildings': 'school', 'Flood Control': 'flood'};
// Icons with knockouts are drawn through a scratch layer so the real background shows through.
let ICON_L = null;
function icon(c, name, x, y, s = 1) {

let LOGO = null; const LOGO_R = 80, LOGO_PX = 1400;
function buildLogo() {
